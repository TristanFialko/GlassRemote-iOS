name: GlassRemote
options:
  bundleIdPrefix: com.glassremote
  deploymentTarget:
    iOS: "16.0"

settings:
  base:
    SWIFT_VERSION: 5.0
    GENERATE_INFOPLIST_FILE: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: ""
    TARGETED_DEVICE_FAMILY: "1"
    INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Glass Remote connects directly to your Android TV over your local Wi-Fi."
    INFOPLIST_KEY_UIUserInterfaceStyle: Dark
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIRequiresFullScreen: NO
    INFOPLIST_KEY_UISupportedInterfaceOrientations:
      - UIInterfaceOrientationPortrait
      - UIInterfaceOrientationLandscapeLeft
      - UIInterfaceOrientationLandscapeRight

targets:
  GlassRemote:
    type: application
    platform: iOS
    sources:
      - path: GlassRemote
        excludes:
          - "glass_uhid_bridge"
          - "glass_uhid_keyboard"
          - "glass_tcp_input_server"
          - "glass_uhid_keyboard_arm64"
          - "glass_tcp_input_server_arm64"
          - "glass_uhid_keyboard.c"
          - "glass_tcp_input_server.c"
          - "glass_cursor_setter.jar"
          - "glass_cursor_white.png"
    resources:
      - path: GlassRemote/glass_uhid_bridge
      - path: GlassRemote/glass_cursor_setter.jar
      - path: GlassRemote/glass_cursor_white.png
    dependencies:
      - package: SwiftADB
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.glassremote.ios
    scheme:
      testTargets:
        - GlassRemoteTests

  GlassRemoteTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/GlassRemoteTests
    dependencies:
      - target: GlassRemote
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.glassremote.ios.tests
        GENERATE_INFOPLIST_FILE: YES

packages:
  SwiftADB:
    url: https://github.com/akshaynexus/SwiftADB.git
    # TODO: pin to a commit. The CI run prints the resolved commit in its summary;
    # replace the next line with `revision: <that SHA>` so upstream changes can't break the build.
    branch: main
