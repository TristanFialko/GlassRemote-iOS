name: iOS build
on:
  workflow_dispatch:
  push:
    # Phase branches build on every push too, so each phase is verified as it lands.
    # The Phase 6 rebuild branch is lower-case, so it is listed explicitly (filters are case-sensitive).
    # The Android TV Remote v2 feature branch builds too, so each milestone is verified on its exact HEAD.
    branches: [ main, v0.4-dev, 'Phase-*', 'phase-6-ui-nuvio-rebuild', 'feature/android-tv-remote-v2' ]

# A newer push to the same branch supersedes the running build, so CI time goes to the latest commit.
concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

# Two macOS jobs run in parallel on separate runners: `test` boots a simulator and runs the unit
# tests; `device` compiles the Android helpers and the physical-iPhone Release build and packages
# the IPA. Measured on one runner, the simulator boot and the two Xcode compiles are all CPU-bound
# and starve each other (12-19 minutes); on separate runners each finishes uncontended. `report`
# then gathers the timings and logs from both and posts the tracking-PR comment.
env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  HOMEBREW_NO_ENV_HINTS: "1"

jobs:
  test:
    name: Simulator build and unit tests
    runs-on: macos-26   # Xcode 26 SDK is required for native Liquid Glass (glassEffect)
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version and capture it for cache keys
        id: toolchain
        shell: bash
        run: |
          xcodebuild -version
          XCODE_ID="$(xcodebuild -version | tr '\n' ' ' | sed -E 's/[^A-Za-z0-9.]+/-/g; s/^-+|-+$//g')"
          echo "xcode=$XCODE_ID" >> "$GITHUB_OUTPUT"

      - name: Ensure Metal toolchain
        # Phase 9 compiles a Metal shader (GlassRemote/DesignSystem/Refraction.metal). Xcode 26 ships the
        # Metal toolchain as a separate component, so fetch it when this runner image lacks it.
        run: |
          if xcrun metal -v >/dev/null 2>&1; then
            echo "Metal toolchain present: $(xcrun metal -v 2>&1 | head -n 1)"
          else
            xcodebuild -downloadComponent MetalToolchain
            xcrun metal -v 2>&1 | head -n 1
          fi

      - name: Install XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          if command -v xcodegen >/dev/null 2>&1; then
            echo "XcodeGen already installed: $(command -v xcodegen)"
          else
            brew install xcodegen
          fi
          xcodegen --version

      - name: Select iPhone simulator and start booting it
        shell: bash
        run: |
          set -euo pipefail
          # The first simulator boot on a fresh runner takes about five minutes and is this job's
          # critical path, so it starts as early as possible. It runs only after the Metal and
          # XcodeGen checks: those mount Xcode components the same way the boot does and stalled
          # for 3-4 minutes when the boot was already in flight. The test step waits for the boot.
          SELECTED="$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          def version(key):
              return [int(p) if p.isdigit() else 0 for p in key.rsplit("-", 2)[-2:]]
          # Newest iOS runtime first, then the first available iPhone in it.
          for runtime in sorted((k for k in data if ".iOS-" in k), key=version, reverse=True):
              for device in data[runtime]:
                  if device.get("isAvailable") and device["name"].startswith("iPhone"):
                      print(device["udid"], device["name"], runtime.rsplit(".", 1)[-1], sep="\t")
                      raise SystemExit
          raise SystemExit("No available iPhone simulator found.")
          ')"
          UDID="${SELECTED%%$'\t'*}"
          echo "Simulator (udid | name | runtime): ${SELECTED//$'\t'/ | }"
          echo "SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"
          # An explicit id plus arch avoids xcodebuild's "multiple matching destinations" lookup (each
          # device is listed as arm64 and x86_64), and both simulator steps use this exact device so
          # the tests run what build-for-testing produced.
          echo "SIMULATOR_DESTINATION=platform=iOS Simulator,id=$UDID,arch=arm64" >> "$GITHUB_ENV"
          echo "SIMULATOR_BOOT_STARTED=$(date +%s)" >> "$GITHUB_ENV"
          # CoreSimulatorService owns the boot, so it carries on after this step ends.
          nohup xcrun simctl boot "$UDID" > "$RUNNER_TEMP/simulator-boot.log" 2>&1 &

      - name: Generate Xcode project
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/ci-logs
          xcodegen generate 2>&1 | tee build/ci-logs/xcodegen.log

      - name: Restore Swift package cache
        id: spm-cache
        # Only SwiftPM's bare git mirrors are cached. Checkouts are recreated from the pinned
        # revision on every run, so the SwiftADB patch below always applies to pristine sources.
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: |
            build/SourcePackages/repositories
            ~/Library/Caches/org.swift.swiftpm/repositories
          key: spm-repos-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.xcode }}-${{ hashFiles('project.yml', '**/Package.resolved') }}
          restore-keys: |
            spm-repos-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.xcode }}-

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project GlassRemote.xcodeproj \
            -scheme GlassRemote \
            -derivedDataPath build

      - name: Save Swift package cache
        # Saved straight after resolution, before the SwiftADB checkout is patched. The device job
        # saves the same key; whichever finishes first wins and the other save is a harmless no-op.
        if: steps.spm-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            build/SourcePackages/repositories
            ~/Library/Caches/org.swift.swiftpm/repositories
          key: ${{ steps.spm-cache.outputs.cache-primary-key }}

      - name: Record resolved SwiftADB commit
        shell: bash
        run: |
          RESOLVED="$(find . -name Package.resolved -not -path './build/SourcePackages/checkouts/*' -print -quit)"
          echo "### Resolved Swift packages" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat "$RESOLVED" >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "SwiftADB is pinned by revision in project.yml; change it there to move to a newer commit." >> "$GITHUB_STEP_SUMMARY"

      - name: Patch SwiftADB iOS compatibility
        shell: bash
        run: |
          find build -name AdbConnection.swift -print
          chmod -R u+w build/SourcePackages/checkouts/SwiftADB
          python3 <<'PY'
          from pathlib import Path
          import re

          root = Path("build/SourcePackages/checkouts/SwiftADB/Sources")
          patches = {
              root / "SwiftADB/AdbConnection.swift": (
                  r"    private func getSecIdentity\(\) -> sec_identity_t\? \{.*?^    \}",
                  """    private func getSecIdentity() -> sec_identity_t? {
                  // Direct ADB TCP does not require a TLS client identity.
                  return nil
              }"""
              ),
              root / "SwiftADB/KeyPair+ADBKeyPair.swift": (
                  r"        guard let identity = SecIdentityCreate\(nil, cert, privateKey\) else \{.*?^        return sec_identity_create\(identity\)!",
                  """        throw NSError(domain: "KeyPair", code: 11,
                      userInfo: [NSLocalizedDescriptionKey:
                      "TLS pairing identity is unavailable in this iOS build"])"""
              )
          }

          for path, (pattern, replacement) in patches.items():
              if not path.is_file():
                  raise SystemExit(f"SwiftADB source file not found: {path}")
              source = path.read_text()
              updated, count = re.subn(
                  pattern, replacement, source, count=1,
                  flags=re.MULTILINE | re.DOTALL
              )
              if count != 1:
                  raise SystemExit(f"Patch target not found exactly once: {path}")
              path.write_text(updated)
              print(f"Patched {path}")
          PY

      - name: Build for testing on iPhone simulator
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/ci-logs
          # COMPILER_INDEX_STORE_ENABLE=NO skips the IDE index store, which nothing in CI reads.
          xcodebuild build-for-testing -project GlassRemote.xcodeproj \
            -scheme GlassRemote \
            -destination "$SIMULATOR_DESTINATION" \
            -configuration Debug \
            -derivedDataPath build \
            -showBuildTimingSummary \
            CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO 2>&1 | tee build/ci-logs/simulator-build.log

      - name: Wait for the iPhone simulator to finish booting
        shell: bash
        run: |
          set -euo pipefail
          started="$(date +%s)"
          # `-b` boots the device if the background boot never started, so this is also the fallback.
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b
          now="$(date +%s)"
          echo "Waited $((now - started))s here; the boot began $((now - SIMULATOR_BOOT_STARTED))s ago, during the earlier steps."
          mkdir -p build/ci-logs
          echo "boot_total=$((now - SIMULATOR_BOOT_STARTED)) boot_wait=$((now - started))" > build/ci-logs/simulator-boot.txt
          cat "$RUNNER_TEMP/simulator-boot.log" 2>/dev/null || true
          xcrun simctl list devices | grep "$SIMULATOR_UDID"

      - name: Run unit tests
        shell: bash
        run: |
          echo "Testing on: $SIMULATOR_DESTINATION"
          set -o pipefail
          mkdir -p build/ci-logs
          xcodebuild test-without-building -project GlassRemote.xcodeproj \
            -scheme GlassRemote \
            -destination "$SIMULATOR_DESTINATION" \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/ci-logs/unit-tests.log

      - name: Summarise compiler and test errors
        if: failure()
        shell: bash
        run: |
          # Diagnostics only: turns "path:line:col: error:" lines from the xcodebuild logs into
          # annotations on the run page plus a short job summary. It never fails the job itself.
          set +e +o pipefail
          shopt -s nullglob
          logs=(build/ci-logs/*.log)
          if [ ${#logs[@]} -eq 0 ]; then
            echo "No xcodebuild logs were captured (the failure happened before the Xcode build)."
            exit 0
          fi
          grep -hE '^/[^:]+:[0-9]+(:[0-9]+)?: (fatal )?error: ' "${logs[@]}" | sort -u > build/ci-logs/errors.txt
          count=$(wc -l < build/ci-logs/errors.txt | tr -d ' ')
          echo "Distinct error lines: $count"
          head -n 10 build/ci-logs/errors.txt | while IFS= read -r line; do
            file="${line%%:*}"
            rest="${line#*:}"
            num="${rest%%:*}"
            rel="${file#"$GITHUB_WORKSPACE"/}"
            msg="$(printf '%s' "${line#*error: }" | sed 's/%/%25/g')"
            echo "::error file=${rel},line=${num},title=xcodebuild::${msg}"
          done
          {
            echo "### Build or test errors"
            echo
            if [ "$count" -gt 0 ]; then
              echo '```'
              head -n 40 build/ci-logs/errors.txt | sed "s|$GITHUB_WORKSPACE/||"
              echo '```'
            else
              echo "No file-level errors found. Last lines of each xcodebuild log:"
              for log in "${logs[@]}"; do
                echo
                echo "**$(basename "$log")**"
                echo '```'
                tail -n 25 "$log"
                echo '```'
              done
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$count" -eq 0 ]; then
            for log in "${logs[@]}"; do
              last="$(grep -E 'error:|\*\* .* FAILED \*\*' "$log" | tail -n 1 | cut -c1-300 | sed 's/%/%25/g')"
              if [ -n "$last" ]; then
                echo "::error title=$(basename "$log")::${last}"
              fi
            done
          fi
          exit 0

      - name: Upload rendered Now Playing and Remote screens
        # Phase9PlayerGapTests renders the real page (portrait and landscape) to PNG so the layout
        # can be compared with its design references. Diagnostics only.
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: glassremote-nowplaying-screens
          path: |
            /tmp/glassremote-snapshots/nowplaying-*.png
            /tmp/glassremote-snapshots/remote-*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: glassremote-build-logs-test
          path: build
          if-no-files-found: ignore

      - name: Upload CI logs for the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs-test
          path: build/ci-logs
          if-no-files-found: ignore
          retention-days: 7

  device:
    name: Helpers, physical iPhone build and IPA
    runs-on: macos-26
    permissions:
      contents: read
    env:
      ANDROID_SDK_ROOT: /opt/homebrew/share/android-commandlinetools
      ANDROID_HOME: /opt/homebrew/share/android-commandlinetools
      NDK_VERSION: 27.2.12479018
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version and capture it for cache keys
        id: toolchain
        shell: bash
        run: |
          xcodebuild -version
          XCODE_ID="$(xcodebuild -version | tr '\n' ' ' | sed -E 's/[^A-Za-z0-9.]+/-/g; s/^-+|-+$//g')"
          echo "xcode=$XCODE_ID" >> "$GITHUB_OUTPUT"

      - name: Ensure Metal toolchain
        run: |
          if xcrun metal -v >/dev/null 2>&1; then
            echo "Metal toolchain present: $(xcrun metal -v 2>&1 | head -n 1)"
          else
            xcodebuild -downloadComponent MetalToolchain
            xcrun metal -v 2>&1 | head -n 1
          fi

      - name: Install XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          if command -v xcodegen >/dev/null 2>&1; then
            echo "XcodeGen already installed: $(command -v xcodegen)"
          else
            brew install xcodegen
          fi
          xcodegen --version

      - name: Restore Android NDK cache
        id: ndk-cache
        # Optimisation only: any cache problem falls back to a clean sdkmanager install below.
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: /opt/homebrew/share/android-commandlinetools/ndk/27.2.12479018
          key: android-ndk-27.2.12479018-${{ runner.os }}-${{ runner.arch }}-v1

      - name: Install Android NDK
        id: ndk
        shell: bash
        env:
          NDK_CACHE_HIT: ${{ steps.ndk-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          NDK_ROOT="$ANDROID_SDK_ROOT/ndk/$NDK_VERSION"
          # A restored NDK is used only if it is exactly the pinned revision and both helper
          # compilers run. Anything else is discarded and reinstalled cleanly by sdkmanager.
          ndk_is_valid() {
            [ -f "$NDK_ROOT/source.properties" ] || return 1
            grep -Eq "^Pkg\.Revision[[:space:]]*=[[:space:]]*${NDK_VERSION//./\\.}[[:space:]]*$" \
              "$NDK_ROOT/source.properties" || return 1
            local triple cc
            for triple in armv7a-linux-androideabi23 aarch64-linux-android23; do
              cc="$(find "$NDK_ROOT/toolchains/llvm/prebuilt" -type f -name "${triple}-clang" -print -quit 2>/dev/null)"
              [ -n "$cc" ] || return 1
              "$cc" --version >/dev/null 2>&1 || return 1
            done
          }
          if [ "${NDK_CACHE_HIT:-}" = "true" ] && ndk_is_valid; then
            # The command-line tools exist only to run sdkmanager, so a valid cached NDK makes
            # the Homebrew cask, licence acceptance and sdkmanager unnecessary on this run.
            echo "Using cached Android NDK $NDK_VERSION; skipping command-line tools and sdkmanager."
            echo "save-cache=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -e "$NDK_ROOT" ]; then
            echo "Discarding a restored NDK that failed validation"
            rm -rf "$NDK_ROOT"
          fi
          if command -v sdkmanager >/dev/null 2>&1 && [ -d "$ANDROID_SDK_ROOT/cmdline-tools" ]; then
            echo "Android command-line tools already installed: $(command -v sdkmanager)"
          else
            brew install --cask android-commandlinetools
          fi
          sdkmanager --version
          # sdkmanager exits successfully after accepting all licences. The
          # upstream `yes` process then receives SIGPIPE; do not let that
          # harmless exit code fail this step under pipefail.
          set +o pipefail
          yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses
          LICENSE_STATUS=${PIPESTATUS[1]}
          set -o pipefail
          if [ "$LICENSE_STATUS" -ne 0 ]; then
            echo "sdkmanager licence acceptance failed with exit code $LICENSE_STATUS"
            exit "$LICENSE_STATUS"
          fi
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" "ndk;$NDK_VERSION"
          grep -E '^Pkg\.Revision' "$NDK_ROOT/source.properties"
          if ndk_is_valid; then
            echo "save-cache=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=Android NDK cache::Fresh NDK did not pass cache validation, so it will not be cached."
            echo "save-cache=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Save Android NDK cache
        # Saved straight after a clean install, before any helper is compiled.
        if: steps.ndk.outputs.save-cache == 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: /opt/homebrew/share/android-commandlinetools/ndk/27.2.12479018
          key: android-ndk-27.2.12479018-${{ runner.os }}-${{ runner.arch }}-v1

      - name: Compile ARM32 UHID keyboard helper
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-/opt/homebrew/share/android-commandlinetools}"
          NDK_ROOT="$SDK_ROOT/ndk/27.2.12479018"
          if [ ! -d "$NDK_ROOT" ]; then
            echo "NDK not found at $NDK_ROOT"
            echo "Installed SDK roots:"
            find "$HOME/Library/Android" -maxdepth 4 -type d -name '27.2.12479018' -print 2>/dev/null || true
            exit 1
          fi

          COMPILER="$(find "$NDK_ROOT/toolchains/llvm/prebuilt" -type f \
            -name armv7a-linux-androideabi23-clang -print -quit)"
          if [ -z "$COMPILER" ]; then
            echo "ARMv7 Android NDK compiler not found. Available prebuilt toolchains:"
            find "$NDK_ROOT/toolchains/llvm/prebuilt" -maxdepth 2 -type d -print || true
            exit 1
          fi

          echo "Using compiler: $COMPILER"
          "$COMPILER" -O2 -Wall -Wextra -fPIE -pie \
            GlassRemote/glass_uhid_keyboard.c \
            -o GlassRemote/glass_uhid_keyboard
          file GlassRemote/glass_uhid_keyboard
          test -s GlassRemote/glass_uhid_keyboard

      - name: Compile ARM32 persistent TCP input server
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-/opt/homebrew/share/android-commandlinetools}"
          NDK_ROOT="$SDK_ROOT/ndk/27.2.12479018"
          COMPILER="$(find "$NDK_ROOT/toolchains/llvm/prebuilt" -type f \
            -name armv7a-linux-androideabi23-clang -print -quit)"
          test -n "$COMPILER"
          "$COMPILER" -O2 -Wall -Wextra -fPIE -pie \
            GlassRemote/glass_tcp_input_server.c \
            -o GlassRemote/glass_tcp_input_server
          file GlassRemote/glass_tcp_input_server
          test -s GlassRemote/glass_tcp_input_server

      - name: Compile ARM64 variants of the helpers
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-/opt/homebrew/share/android-commandlinetools}"
          NDK_ROOT="$SDK_ROOT/ndk/27.2.12479018"
          COMPILER="$(find "$NDK_ROOT/toolchains/llvm/prebuilt" -type f \
            -name aarch64-linux-android23-clang -print -quit)"
          test -n "$COMPILER"
          for name in glass_uhid_keyboard glass_tcp_input_server; do
            "$COMPILER" -O2 -Wall -Wextra -fPIE -pie \
              "GlassRemote/${name}.c" -o "GlassRemote/${name}_arm64"
            file "GlassRemote/${name}_arm64"
            test -s "GlassRemote/${name}_arm64"
          done

      - name: Generate Xcode project
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/ci-logs
          xcodegen generate 2>&1 | tee build/ci-logs/xcodegen.log

      - name: Restore Swift package cache
        id: spm-cache
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: |
            build/SourcePackages/repositories
            ~/Library/Caches/org.swift.swiftpm/repositories
          key: spm-repos-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.xcode }}-${{ hashFiles('project.yml', '**/Package.resolved') }}
          restore-keys: |
            spm-repos-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.xcode }}-

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project GlassRemote.xcodeproj \
            -scheme GlassRemote \
            -derivedDataPath build

      - name: Save Swift package cache
        if: steps.spm-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            build/SourcePackages/repositories
            ~/Library/Caches/org.swift.swiftpm/repositories
          key: ${{ steps.spm-cache.outputs.cache-primary-key }}

      - name: Patch SwiftADB iOS compatibility
        shell: bash
        run: |
          find build -name AdbConnection.swift -print
          chmod -R u+w build/SourcePackages/checkouts/SwiftADB
          python3 <<'PY'
          from pathlib import Path
          import re

          root = Path("build/SourcePackages/checkouts/SwiftADB/Sources")
          patches = {
              root / "SwiftADB/AdbConnection.swift": (
                  r"    private func getSecIdentity\(\) -> sec_identity_t\? \{.*?^    \}",
                  """    private func getSecIdentity() -> sec_identity_t? {
                  // Direct ADB TCP does not require a TLS client identity.
                  return nil
              }"""
              ),
              root / "SwiftADB/KeyPair+ADBKeyPair.swift": (
                  r"        guard let identity = SecIdentityCreate\(nil, cert, privateKey\) else \{.*?^        return sec_identity_create\(identity\)!",
                  """        throw NSError(domain: "KeyPair", code: 11,
                      userInfo: [NSLocalizedDescriptionKey:
                      "TLS pairing identity is unavailable in this iOS build"])"""
              )
          }

          for path, (pattern, replacement) in patches.items():
              if not path.is_file():
                  raise SystemExit(f"SwiftADB source file not found: {path}")
              source = path.read_text()
              updated, count = re.subn(
                  pattern, replacement, source, count=1,
                  flags=re.MULTILINE | re.DOTALL
              )
              if count != 1:
                  raise SystemExit(f"Patch target not found exactly once: {path}")
              path.write_text(updated)
              print(f"Patched {path}")
          PY

      - name: Build for physical iPhone
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/ci-logs
          xcodebuild -project GlassRemote.xcodeproj \
            -scheme GlassRemote \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath build \
            -showBuildTimingSummary \
            CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO build 2>&1 | tee build/ci-logs/device-build.log

      - name: Bundle and verify helpers
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/GlassRemote.app"
          mkdir -p "$APP_PATH"
          cp GlassRemote/glass_uhid_bridge "$APP_PATH/glass_uhid_bridge"
          chmod 755 "$APP_PATH/glass_uhid_bridge"
          cp GlassRemote/glass_uhid_keyboard "$APP_PATH/glass_uhid_keyboard"
          chmod 755 "$APP_PATH/glass_uhid_keyboard"
          cp GlassRemote/glass_tcp_input_server "$APP_PATH/glass_tcp_input_server"
          chmod 755 "$APP_PATH/glass_tcp_input_server"
          cp GlassRemote/glass_uhid_keyboard_arm64 "$APP_PATH/glass_uhid_keyboard_arm64"
          chmod 755 "$APP_PATH/glass_uhid_keyboard_arm64"
          cp GlassRemote/glass_tcp_input_server_arm64 "$APP_PATH/glass_tcp_input_server_arm64"
          chmod 755 "$APP_PATH/glass_tcp_input_server_arm64"
          cp GlassRemote/glass_cursor_setter.jar "$APP_PATH/glass_cursor_setter.jar"
          cp GlassRemote/glass_cursor_white.png "$APP_PATH/glass_cursor_white.png"
          test -s "$APP_PATH/glass_cursor_setter.jar"
          test -s "$APP_PATH/glass_cursor_white.png"
          file "$APP_PATH/glass_uhid_bridge"
          file "$APP_PATH/glass_uhid_keyboard"
          test -s "$APP_PATH/glass_uhid_bridge"
          test -s "$APP_PATH/glass_uhid_keyboard"
          test -s "$APP_PATH/glass_tcp_input_server"

      - name: Package unsigned IPA
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/GlassRemote.app"
          test -d "$APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          /usr/bin/zip -qry GlassRemote-unsigned.ipa Payload
          mkdir -p build/ci-logs
          du -h GlassRemote-unsigned.ipa | cut -f1 > build/ci-logs/ipa-size.txt

      - name: Upload unsigned iPhone app
        uses: actions/upload-artifact@v4
        with:
          name: glassremote-unsigned-ipa
          path: GlassRemote-unsigned.ipa
          if-no-files-found: error

      - name: Summarise compiler errors
        if: failure()
        shell: bash
        run: |
          # Diagnostics only: turns "path:line:col: error:" lines from the xcodebuild logs into
          # annotations on the run page plus a short job summary. It never fails the job itself.
          set +e +o pipefail
          shopt -s nullglob
          logs=(build/ci-logs/*.log)
          if [ ${#logs[@]} -eq 0 ]; then
            echo "No xcodebuild logs were captured (the failure happened before the Xcode build)."
            exit 0
          fi
          grep -hE '^/[^:]+:[0-9]+(:[0-9]+)?: (fatal )?error: ' "${logs[@]}" | sort -u > build/ci-logs/errors.txt
          count=$(wc -l < build/ci-logs/errors.txt | tr -d ' ')
          echo "Distinct error lines: $count"
          head -n 10 build/ci-logs/errors.txt | while IFS= read -r line; do
            file="${line%%:*}"
            rest="${line#*:}"
            num="${rest%%:*}"
            rel="${file#"$GITHUB_WORKSPACE"/}"
            msg="$(printf '%s' "${line#*error: }" | sed 's/%/%25/g')"
            echo "::error file=${rel},line=${num},title=xcodebuild::${msg}"
          done
          {
            echo "### Build errors"
            echo
            if [ "$count" -gt 0 ]; then
              echo '```'
              head -n 40 build/ci-logs/errors.txt | sed "s|$GITHUB_WORKSPACE/||"
              echo '```'
            else
              echo "No file-level errors found. Last lines of each xcodebuild log:"
              for log in "${logs[@]}"; do
                echo
                echo "**$(basename "$log")**"
                echo '```'
                tail -n 25 "$log"
                echo '```'
              done
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$count" -eq 0 ]; then
            for log in "${logs[@]}"; do
              last="$(grep -E 'error:|\*\* .* FAILED \*\*' "$log" | tail -n 1 | cut -c1-300 | sed 's/%/%25/g')"
              if [ -n "$last" ]; then
                echo "::error title=$(basename "$log")::${last}"
              fi
            done
          fi
          exit 0

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: glassremote-build-logs-device
          path: build
          if-no-files-found: ignore

      - name: Upload CI logs for the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs-device
          path: build/ci-logs
          if-no-files-found: ignore
          retention-days: 7

  report:
    name: CI timing and PR report
    # Diagnostics only. Runs on Linux (cheap, fast to start) after both macOS jobs, whatever
    # their result, and never fails the workflow.
    needs: [test, device]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Read-only: lets the timing step list every job's step durations.
      actions: read
      # Only used by the final report step, which comments on the open PR for this branch.
      pull-requests: write
      issues: write
    env:
      TEST_RESULT: ${{ needs.test.result }}
      DEVICE_RESULT: ${{ needs.device.result }}
    steps:
      - name: Download CI logs from both jobs
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: ci-logs-*
          path: build/ci-logs
          merge-multiple: true

      - name: Record CI timing
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Records each job's step durations plus Xcode's build timing summaries, so future runs
          # show where CI time goes.
          set +e +o pipefail
          jobs_json="$RUNNER_TEMP/ci-jobs.json"
          timing="$RUNNER_TEMP/ci-timing.md"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/${GITHUB_RUN_ATTEMPT:-1}/jobs?per_page=100" \
            > "$jobs_json" 2>/dev/null
          python3 - "$jobs_json" > "$timing" <<'PY'
          import json, os, sys
          from datetime import datetime, timezone

          def parse(ts):
              if not ts:
                  return None
              try:
                  return datetime.fromisoformat(ts.replace("Z", "+00:00"))
              except ValueError:
                  return None

          def fmt(seconds):
              seconds = int(round(seconds))
              return f"{seconds // 60}m {seconds % 60:02d}s"

          print("### CI timing")
          print()
          try:
              with open(sys.argv[1]) as handle:
                  jobs = json.load(handle).get("jobs", [])
          except Exception:
              jobs = []
          jobs = [j for j in jobs if j.get("name") != os.environ.get("GITHUB_JOB", "report") and not str(j.get("name", "")).startswith("CI timing")]
          if not jobs:
              print("Step timings unavailable (the jobs could not be read from the Actions API).")
              sys.exit(0)
          starts = [parse(j.get("started_at")) for j in jobs if parse(j.get("started_at"))]
          ends = [parse(j.get("completed_at")) or datetime.now(timezone.utc) for j in jobs]
          if starts:
              wall = (max(ends) - min(starts)).total_seconds()
              billed = sum((e - s).total_seconds() for s, e in zip(starts, ends))
              print(f"Wall clock across the macOS jobs: **{fmt(wall)}** (they ran in parallel; {fmt(billed)} of macOS runner time in total)")
              print()
          for job in jobs:
              s, e = parse(job.get("started_at")), parse(job.get("completed_at"))
              total = fmt((e - s).total_seconds()) if s and e else "running"
              print(f"#### {job.get('name')} — {total}, {job.get('conclusion') or job.get('status')}")
              print()
              rows = []
              for step in job.get("steps", []):
                  ss, se = parse(step.get("started_at")), parse(step.get("completed_at"))
                  if ss and se and step.get("conclusion") != "skipped":
                      rows.append((step.get("name", "?"), (se - ss).total_seconds(), step.get("conclusion") or step.get("status")))
              print("| Step | Duration | Result |")
              print("| --- | ---: | --- |")
              for name, seconds, result in rows:
                  print(f"| {name} | {fmt(seconds)} | {result} |")
              slowest = sorted(rows, key=lambda row: row[1], reverse=True)[:3]
              if slowest:
                  print()
                  print("Slowest: " + ", ".join(f"{name} ({fmt(seconds)})" for name, seconds, _ in slowest))
              print()
          PY
          {
            echo "#### Simulator"
            echo
            if [ -s build/ci-logs/simulator-boot.txt ]; then
              read -r total wait < build/ci-logs/simulator-boot.txt
              echo "- Boot: ${total#boot_total=}s from job start to booted, of which ${wait#boot_wait=}s was spent waiting before the tests"
            else
              echo "- Boot timing unavailable"
            fi
          } >> "$timing"
          for log in build/ci-logs/simulator-build.log build/ci-logs/device-build.log; do
            [ -s "$log" ] || continue
            section="$(awk '/Build Timing Summary/ {found=1} found {print} found && /^\*\* .* \*\*/ {exit}' "$log" | head -n 80)"
            {
              echo
              echo "#### Xcode build timing: $(basename "$log" .log)"
              echo
              if [ -n "$section" ]; then
                echo '```'
                printf '%s\n' "$section"
                echo '```'
              else
                echo "No build timing summary in this log."
              fi
            } >> "$timing"
          done
          cat "$timing"
          cat "$timing" >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Report results on the tracking pull request
        if: ${{ github.ref_name == 'phase-6-ui-nuvio-rebuild' || startsWith(github.ref_name, 'Phase-9') || github.ref_name == 'feature/android-tv-remote-v2' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Posts a short build/test report on the open pull request for this branch, so results
          # can be reviewed without opening the Actions UI. Never fails the job.
          set +e +o pipefail
          shopt -s nullglob
          PR="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$GITHUB_REF_NAME" --state open --json number --jq '.[0].number // empty')"
          if [ -z "$PR" ]; then
            echo "No open pull request for $GITHUB_REF_NAME; skipping report."
            exit 0
          fi
          if [ "$TEST_RESULT" = "success" ] && [ "$DEVICE_RESULT" = "success" ]; then
            STATUS="success"
          else
            STATUS="failure"
          fi
          mkdir -p build
          report=build/ci-report.md
          {
            echo "### CI ${STATUS}: \`${GITHUB_SHA:0:7}\`"
            echo
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo "Simulator build and unit tests: ${TEST_RESULT}; helpers, physical iPhone build and IPA: ${DEVICE_RESULT}"
            if [ -s build/ci-logs/ipa-size.txt ]; then
              echo
              echo "Unsigned IPA: $(cat build/ci-logs/ipa-size.txt), artifact \`glassremote-unsigned-ipa\`"
            fi
            logs=(build/ci-logs/*.log)
            if [ ${#logs[@]} -eq 0 ]; then
              echo
              echo "No build logs were captured; the failure happened before the Xcode steps."
            fi
            for log in "${logs[@]}"; do
              name="$(basename "$log")"
              result="$(grep -E '\*\* [A-Z ]+ (SUCCEEDED|FAILED) \*\*' "$log" | tail -n 1)"
              tests="$(grep -E 'Executed [0-9]+ tests?' "$log" | tail -n 1)"
              echo
              echo "**${name}**: ${result:-no result line}"
              if [ -n "$tests" ]; then
                echo
                echo "${tests}"
              fi
              problems="$(grep -E '(^|[^a-zA-Z])(fatal )?error:|Undefined symbol|Test Case .* failed|Testing failed' "$log" \
                | sed "s|/Users/runner/work/${GITHUB_REPOSITORY#*/}/${GITHUB_REPOSITORY#*/}/||g" | awk '!seen[$0]++' | head -n 60)"
              if [ -n "$problems" ]; then
                echo
                echo '```'
                printf '%s\n' "$problems" | cut -c1-400
                echo '```'
              fi
            done
          } > "$report"
          head -c 60000 "$report" > build/ci-report-trimmed.md
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file build/ci-report-trimmed.md || echo "Could not post the report."
          exit 0
