name: iOS build
on:
  workflow_dispatch:
  push:
    # Phase branches build on every push too, so each phase is verified as it lands.
    branches: [ main, v0.4-dev, 'Phase-*' ]

jobs:
  build:
    runs-on: macos-26   # Xcode 26 SDK is required for native Liquid Glass (glassEffect)
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Install Android NDK
        shell: bash
        run: |
          set -euo pipefail
          brew install --cask android-commandlinetools
          SDK_ROOT="/opt/homebrew/share/android-commandlinetools"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          # sdkmanager exits successfully after accepting all licences. The
          # upstream `yes` process then receives SIGPIPE; do not let that
          # harmless exit code fail this step under pipefail.
          set +o pipefail
          yes | sdkmanager --sdk_root="$SDK_ROOT" --licenses
          LICENSE_STATUS=${PIPESTATUS[1]}
          set -o pipefail
          if [ "$LICENSE_STATUS" -ne 0 ]; then
            echo "sdkmanager licence acceptance failed with exit code $LICENSE_STATUS"
            exit "$LICENSE_STATUS"
          fi
          sdkmanager --sdk_root="$SDK_ROOT" "ndk;27.2.12479018"

      - name: Compile ARM32 UHID keyboard helper
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-/opt/homebrew/share/android-commandlinetools}"
          NDK_ROOT="$SDK_ROOT/ndk/27.2.12479018"
          if [ ! -d "$NDK_ROOT" ]; then
            echo "NDK not found at $NDK_ROOT"
            echo "Installed SDK roots:"
            find "$HOME/Library/Android" -maxdepth 4 -type d -name '27.2.12479018' -print 2>/dev/null || true
            exit 1
          fi

          COMPILER="$(find "$NDK_ROOT/toolchains/llvm/prebuilt" -type f \
            -name armv7a-linux-androideabi23-clang -print -quit)"
          if [ -z "$COMPILER" ]; then
            echo "ARMv7 Android NDK compiler not found. Available prebuilt toolchains:"
            find "$NDK_ROOT/toolchains/llvm/prebuilt" -maxdepth 2 -type d -print || true
            exit 1
          fi

          echo "Using compiler: $COMPILER"
          "$COMPILER" -O2 -Wall -Wextra -fPIE -pie \
            GlassRemote/glass_uhid_keyboard.c \
            -o GlassRemote/glass_uhid_keyboard
          file GlassRemote/glass_uhid_keyboard
          test -s GlassRemote/glass_uhid_keyboard

      - name: Compile ARM32 persistent TCP input server
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-/opt/homebrew/share/android-commandlinetools}"
          NDK_ROOT="$SDK_ROOT/ndk/27.2.12479018"
          COMPILER="$(find "$NDK_ROOT/toolchains/llvm/prebuilt" -type f \
            -name armv7a-linux-androideabi23-clang -print -quit)"
          test -n "$COMPILER"
          "$COMPILER" -O2 -Wall -Wextra -fPIE -pie \
            GlassRemote/glass_tcp_input_server.c \
            -o GlassRemote/glass_tcp_input_server
          file GlassRemote/glass_tcp_input_server
          test -s GlassRemote/glass_tcp_input_server

      - name: Compile ARM64 variants of the helpers
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-/opt/homebrew/share/android-commandlinetools}"
          NDK_ROOT="$SDK_ROOT/ndk/27.2.12479018"
          COMPILER="$(find "$NDK_ROOT/toolchains/llvm/prebuilt" -type f \
            -name aarch64-linux-android23-clang -print -quit)"
          test -n "$COMPILER"
          for name in glass_uhid_keyboard glass_tcp_input_server; do
            "$COMPILER" -O2 -Wall -Wextra -fPIE -pie \
              "GlassRemote/${name}.c" -o "GlassRemote/${name}_arm64"
            file "GlassRemote/${name}_arm64"
            test -s "GlassRemote/${name}_arm64"
          done

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project GlassRemote.xcodeproj \
            -scheme GlassRemote \
            -derivedDataPath build

      - name: Record resolved SwiftADB commit
        shell: bash
        run: |
          RESOLVED="$(find . -name Package.resolved -not -path './build/SourcePackages/checkouts/*' -print -quit)"
          echo "### Resolved Swift packages" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat "$RESOLVED" >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "SwiftADB is pinned by revision in project.yml; change it there to move to a newer commit." >> "$GITHUB_STEP_SUMMARY"

      - name: Locate SwiftADB source
        run: find build -name AdbConnection.swift -print

      - name: Patch SwiftADB iOS compatibility
        shell: bash
        run: |
          chmod -R u+w build/SourcePackages/checkouts/SwiftADB
          python3 <<'PY'
          from pathlib import Path
          import re

          root = Path("build/SourcePackages/checkouts/SwiftADB/Sources")
          patches = {
              root / "SwiftADB/AdbConnection.swift": (
                  r"    private func getSecIdentity\(\) -> sec_identity_t\? \{.*?^    \}",
                  """    private func getSecIdentity() -> sec_identity_t? {
                  // Direct ADB TCP does not require a TLS client identity.
                  return nil
              }"""
              ),
              root / "SwiftADB/KeyPair+ADBKeyPair.swift": (
                  r"        guard let identity = SecIdentityCreate\(nil, cert, privateKey\) else \{.*?^        return sec_identity_create\(identity\)!",
                  """        throw NSError(domain: "KeyPair", code: 11,
                      userInfo: [NSLocalizedDescriptionKey:
                      "TLS pairing identity is unavailable in this iOS build"])"""
              )
          }

          for path, (pattern, replacement) in patches.items():
              if not path.is_file():
                  raise SystemExit(f"SwiftADB source file not found: {path}")
              source = path.read_text()
              updated, count = re.subn(
                  pattern, replacement, source, count=1,
                  flags=re.MULTILINE | re.DOTALL
              )
              if count != 1:
                  raise SystemExit(f"Patch target not found exactly once: {path}")
              path.write_text(updated)
              print(f"Patched {path}")
          PY

      - name: Build for iPhone simulator
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/ci-logs
          xcodebuild -project GlassRemote.xcodeproj \
            -scheme GlassRemote \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build/ci-logs/simulator-build.log

      - name: Run unit tests
        shell: bash
        run: |
          DEVICE="$(xcrun simctl list devices available | grep -m1 -oE 'iPhone [0-9A-Za-z ]+' | sed 's/ *$//')"
          echo "Testing on: $DEVICE"
          set -o pipefail
          mkdir -p build/ci-logs
          xcodebuild test -project GlassRemote.xcodeproj \
            -scheme GlassRemote \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/ci-logs/unit-tests.log

      - name: Build for physical iPhone
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/ci-logs
          xcodebuild -project GlassRemote.xcodeproj \
            -scheme GlassRemote \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build/ci-logs/device-build.log

      - name: Bundle and verify helpers
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/GlassRemote.app"
          mkdir -p "$APP_PATH"
          cp GlassRemote/glass_uhid_bridge "$APP_PATH/glass_uhid_bridge"
          chmod 755 "$APP_PATH/glass_uhid_bridge"
          cp GlassRemote/glass_uhid_keyboard "$APP_PATH/glass_uhid_keyboard"
          chmod 755 "$APP_PATH/glass_uhid_keyboard"
          cp GlassRemote/glass_tcp_input_server "$APP_PATH/glass_tcp_input_server"
          chmod 755 "$APP_PATH/glass_tcp_input_server"
          cp GlassRemote/glass_uhid_keyboard_arm64 "$APP_PATH/glass_uhid_keyboard_arm64"
          chmod 755 "$APP_PATH/glass_uhid_keyboard_arm64"
          cp GlassRemote/glass_tcp_input_server_arm64 "$APP_PATH/glass_tcp_input_server_arm64"
          chmod 755 "$APP_PATH/glass_tcp_input_server_arm64"
          cp GlassRemote/glass_cursor_setter.jar "$APP_PATH/glass_cursor_setter.jar"
          cp GlassRemote/glass_cursor_white.png "$APP_PATH/glass_cursor_white.png"
          test -s "$APP_PATH/glass_cursor_setter.jar"
          test -s "$APP_PATH/glass_cursor_white.png"
          file "$APP_PATH/glass_uhid_bridge"
          file "$APP_PATH/glass_uhid_keyboard"
          test -s "$APP_PATH/glass_uhid_bridge"
          test -s "$APP_PATH/glass_uhid_keyboard"
          test -s "$APP_PATH/glass_tcp_input_server"

      - name: Package unsigned IPA
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/GlassRemote.app"
          test -d "$APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          /usr/bin/zip -qry GlassRemote-unsigned.ipa Payload

      - name: Upload unsigned iPhone app
        uses: actions/upload-artifact@v4
        with:
          name: glassremote-unsigned-ipa
          path: GlassRemote-unsigned.ipa
          if-no-files-found: error

      - name: Summarise compiler and test errors
        if: failure()
        shell: bash
        run: |
          # Diagnostics only: turns "path:line:col: error:" lines from the xcodebuild logs into
          # annotations on the run page plus a short job summary. It never fails the job itself.
          set +e +o pipefail
          shopt -s nullglob
          logs=(build/ci-logs/*.log)
          if [ ${#logs[@]} -eq 0 ]; then
            echo "No xcodebuild logs were captured (the failure happened before the Xcode build)."
            exit 0
          fi
          grep -hE '^/[^:]+:[0-9]+(:[0-9]+)?: (fatal )?error: ' "${logs[@]}" | sort -u > build/ci-logs/errors.txt
          count=$(wc -l < build/ci-logs/errors.txt | tr -d ' ')
          echo "Distinct error lines: $count"
          head -n 10 build/ci-logs/errors.txt | while IFS= read -r line; do
            file="${line%%:*}"
            rest="${line#*:}"
            num="${rest%%:*}"
            rel="${file#"$GITHUB_WORKSPACE"/}"
            msg="$(printf '%s' "${line#*error: }" | sed 's/%/%25/g')"
            echo "::error file=${rel},line=${num},title=xcodebuild::${msg}"
          done
          {
            echo "### Build or test errors"
            echo
            if [ "$count" -gt 0 ]; then
              echo '```'
              head -n 40 build/ci-logs/errors.txt | sed "s|$GITHUB_WORKSPACE/||"
              echo '```'
            else
              echo "No file-level errors found. Last lines of each xcodebuild log:"
              for log in "${logs[@]}"; do
                echo
                echo "**$(basename "$log")**"
                echo '```'
                tail -n 25 "$log"
                echo '```'
              done
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$count" -eq 0 ]; then
            for log in "${logs[@]}"; do
              last="$(grep -E 'error:|\*\* .* FAILED \*\*' "$log" | tail -n 1 | cut -c1-300 | sed 's/%/%25/g')"
              if [ -n "$last" ]; then
                echo "::error title=$(basename "$log")::${last}"
              fi
            done
          fi
          exit 0

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: glassremote-build-logs
          path: build
          if-no-files-found: ignore
