name: iOS build
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build for iPhone simulator
        run: xcodebuild -project GlassRemote.xcodeproj -scheme GlassRemote -sdk iphonesimulator -configuration Debug -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: glassremote-build-logs
          path: build
          if-no-files-found: ignore
